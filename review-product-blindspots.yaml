findings:
  - dimension: 架构真实性 - 双通道名存实亡
    severity: critical
    title: HTTP 读通道大面积不可用但 SKILL.md 仍宣称双通道
    detail: >-
      这是最大盲区，8轮评审全部遗漏。zhihu-signature.js 第8-20行有正式决策注释
      "正式决策：放弃 HTTP 签名通道"，明确说明 x-zse-96 签名算法逆向失败、
      "逆向成本 > 2 天，触发 Plan B 预设规则"。READM.md 第31行也写明
      "HTTP 签名通道因 API 签名算法逆向成本过高已正式放弃"。
      影响范围：config/api-endpoints.json 中 6 个端点有 3 个需要签名
      (hotList、search、article)，而这3个正是核心功能（热榜、搜索、文章提取）。
      更严重的是，zhihu-extract.js 第69-82行中这3个端点的浏览器降级
      (browser_pending) 全部返回 null data，注释写着
      "需等待 Phase 2 开发完成"— 意味着降级路径也是空壳。
      实际上只有 user/question/answers 3个不需要签名的公开端点可用。
      用户看到的SKILL.md和README.md（README.md已注明但SKILL.md没有）描述的
      "双通道架构"是虚假承诺。
    recommendation: >-
      立即修正SKILL.md描述，将架构改为"浏览器单通道（部分公开API辅助）"。
      删除或隐藏不可用的HTTP通道文档。将phas-1.5（双引擎融合）优先级调整为P0
      — 因为当前根本没有"双引擎"可融合。如果签名逆向不可行，应集中100%资源
      优化浏览器通道性能（热榜/搜索/文章的浏览器提取），而不是维护一个
      虚假的双通道架构文档。

  - dimension: 功能覆盖度
    severity: critical
    title: 缺失知乎创作生态核心场景 — 合集、专栏管理、收藏、视频想法
    detail: >-
      方案列出了6大功能（文章/想法/回答/提问/互动/数据提取），但漏掉了知乎
      创作生态的关键能力：(1) 合集（Collection）是知乎重要内容组织方式，
      没有支持；(2) 专栏管理 — 只能发布不能管理已有专栏文章（编辑、删除、
      排序）；(3) 收藏 — interaction模块只有点赞/评论/关注，缺少收藏
      （知乎核心互动指标之一）；(4) 想法带视频 — publishThought只支持图片
      `--image`，不支持上传视频，而视频想法在知乎传播力远高于图文想法。
      这些缺失意味着AI Agent只能完成半条创作链路：可以生产内容，但无法管理
      内容资产、无法参与合集生态、无法利用视频传播渠道。
    recommendation: >-
      Phase 3应增加：(1) 合集创建与内容归类（特别是自动将同类文章加入合集）；
      (2) 专栏文章管理（编辑标题/摘要/封面、删除、排序）；
      (3) 收藏功能（对内容/回答进行收藏）；(4) 想法视频上传。
      优先级：收藏 > 合集 > 专栏管理 > 视频想法。

  - dimension: 用户价值排序
    severity: high
    title: 最核心场景"热榜+搜索"实际上不可用，但未列为P0修复
    detail: >-
      实施方案有5个Phase，但Phase 1 是"基础设施修复"（选选择器/Cookie加密等），
      Phase 1.5 是"双引擎融合"，Phase 2 才是"核心反爬+浏览器"。
      然而热榜（hot-list）和搜索（search）是用户最频繁使用、价值最高的功能
      — 看热榜、找问题、了解热点。但当前这2个核心功能需要签名的HTTP端点
      返回错误数据时，浏览器降级路径(browser_pending)完全没有实现。
      这意味着用户在Phase 2完成前，核心功能根本不能用。产品发布后有用户
      输入"看热榜"得到的是 null data 和 "需等待 Phase 2" 的提示。
      这是严重的价值倒挂：最常用的功能最后做，最先做的基础设施用户看不见。
    recommendation: >-
      重新排序Phase: P0 = 浏览器通道热榜/搜索提取（现在可用公开API+浏览器兜底）。
      将phase的浏览器热榜提取前置到Phase 1。Phase 1的"基础设施"可以并行进行。
      至少确保MVP发布时 "看热榜"、"搜内容" 能用。

  - dimension: MVP边界
    severity: high
    title: MVP严重膨胀 — 42项修复后边界模糊
    detail: >-
      经过42项修复后方案从"发文章+看热榜"膨胀到包含圈子互动(Python OpenAPI)、
      签名引擎适配器、密钥轮换依赖、Playwright Stealth、Plan B降级链路、
      沙箱测试模式、CI矩阵、Dependabot等大量"工程完整性"功能。
      但核心用户价值链（热榜→选问题→回答/提问→发文章→互动→看效果）
      实际只有 "发文章/想法/回答/提问" 可用。数据提取仅 user/question/answers
      可用。方案的 "11天" 工时预估在包含如此多工程细节后几乎不可能准确。
      真正的MVP应该切在：用户能否完成一次完整的 "发现→参与→发布→互动"
      端到端闭环？当前不行（热榜发现链断裂）。
    recommendation: >-
      重新定义MVP边界为"浏览器单一通道 + 公开API辅助"，裁掉：
      (1) Python OpenAPI圈子互动（ZHIHU_APP_KEY/ZHIHU_APP_SECRET 从必选移除）；
      (2) 签名引擎适配器（废弃代码）；
      (3) 沙箱模式（移至v2.1）；
      (4) Plan B降级（单通道不需要Plan B）。
      MVP核心：浏览器发布文章/想法/回答/提问 + 公开API热榜/搜索 + 互动。
      预计可砍掉约40%代码和50%工时。

  - dimension: 竞品盲区
    severity: high
    title: 未做竞品分析 — 同类工具已有成熟方案
    detail: >-
      方案完全未提及已有知乎自动化工具。市场上知乎内容自动化工具包括：
      (1) 知乎官方创作者平台（zhuanlan.zhihu.com）本身提供数据分析、
      定时发布、多专栏管理 — 官方功能正在补齐；(2) 第三方MCN工具
      （如"新榜"、"萤火"等）支持知乎多账号管理、定时发布、数据看板、
      内容库；(3) 开源方案（如NoneBot插件、zhihu-automation等）
      已有社区维护的浏览器自动化方案。本方案差异优势不明确：没有定时发布
      （竞品有）、没有多账号（竞品有）、没有数据分析（竞品有）。
      唯一差异化可能是AI生成内容，但方案完全没有讨论AI内容策略。
    recommendation: >-
      做竞品矩阵调研，明确定位。建议差异化方向：(1) AI内容生成+自动化发布
      闭环（竞品无）；(2) 内容策略智能调度（GPT分析热榜趋势→生成选题→
      自动发布）；(3) 效果追踪与优化闭环。如果只是做浏览器自动发布，没有
      竞品不可替代性。

  - dimension: 内容策略缺失
    severity: high
    title: 有"发"没有"发什么" — 内容生产策略完全缺失
    detail: >-
      方案6大功能全部聚焦于"如何发"，但从未讨论"发什么"、"什么时候发"、
      "什么调性"。作为AI自动化工具，内容策略是核心竞争力。
      缺失包括：(1) 内容生成模板 — 文章、想法、回答应该有不同的prompt
      策略和风格指南；(2) 热榜驱动内容 — 看了热榜后应该能自动生成对应
      选题建议；(3) 定时策略 — 知乎用户活跃时间分布（晚上8-11点高峰期）
      未被考虑；(4) AI生成内容检测风险 — 知乎有反AI政策，自动发布
      AI内容可能导致封号；(5) 内容调性配置 — 专业回答 vs 轻松想法的
      风格切换；(6) 交叉推广 — 回答中引用自己文章、想法中预热回答等策略。
    recommendation: >-
      (1) 增加 content-templates/ 目录，提供多套AI写作prompt模板；
      (2) 增加内容风险检测模块（检测AI痕迹、敏感词、知乎社区规范）；
      (3) 在SKILL.md用户触发词中增加"帮我写一篇关于xxx的文章" —
      不仅仅是发，还有AI生成能力；(4) 思考定时发布机制（即使只是
      浏览器端的定时点击）。

  - dimension: SKILL.md用户视角
    severity: medium
    title: SKILL.md面向用户的触发词与实际可用功能不匹配
    detail: >-
      SKILL.md第14-16行列出的触发词包括"查看知乎热榜"、"知乎热搜"、
      "知乎数据"、"提取知乎信息"。但实际测试这些功能时（热榜/搜索
      需要签名的端点），用户得到的是失败或空数据。用户说"看热榜"
      然后得到错误提示，这会严重破坏信任。此外，SKILL.md列出的
      CLI命令如 `node scripts/zhihu-extract.js --type hot-list` 在
      当前实现下无法工作（签名失败 → browser_pending → null）。
      用户按文档操作得到失败结果。
      更隐蔽的问题是：SKILL.md说"读操作→HTTP"但没说明需要ZHIHU_COOKIE_KEY，
      而HTTP端点实际也依赖Cookie传递（参考 zhihu-http.js 中Cookie在处理逻辑
      但没有在SKILL.md的env标注中体现为读通道必需）。
    recommendation: >-
      (1) 即时修正SKILL.md中不可用的触发词，或明确标记哪些功能在开发中；
      (2) 在触发词中增加"（测试中）"标记；(3) SKILL.md的依赖标注增加
      Cookie为读通道必需；(4) 建立用户能看到的功能清单表（status列），
      标注 可用/有限可用/开发中。

  - dimension: 单点故障风险
    severity: medium
    title: 浏览器单通道架构下所有写操作依赖同一Chromium进程
    detail: >-
      实际架构（去掉不可用的HTTP通道后）所有写+大部分读操作都依赖同一个
      Playwright浏览器进程。zhihu-core.js 第198-199行的 browserInstance
      是全局单例。任何操作中的页面崩溃、Cookie过期、验证码弹出都会阻塞
      整个系统。withCrashRecovery只有2次重试。极端场景：用户在发文章时
      遇到滑块验证码，系统进入等待手动验证状态(zhihu-core.js 第329行
      waitForLogin)，此时所有其他操作（点赞、评论、看热榜）全部卡住。
      这是一个没有防抖机制的全局锁。
    recommendation: >-
      (1) 改为每个操作独立页面/独立context，避免全局锁；
      (2) 验证码弹出时应有超时+优雅降级（而非无限等待）；
      (3) 考虑多context池（connection pool模式），支持并发操作；
      (4) withCrashRecovery加强为3次且包含浏览器重启。

  - dimension: 多账号支持
    severity: medium
    title: 单Cookie路径不支持多知乎账号切换
    detail: >-
      Cookie存储在固定路径 `~/.hermes/credentials/zhihu-cookies.enc`，
      使用固定的 `ZHIHU_COOKIE_KEY`。整个系统只支持一个知乎账号。
      对于内容运营场景（MCN、品牌号、个人号分离），多账号是刚需。
      方案没有多账号的设计，也没有账号切换的API。
    recommendation: >-
      (1) Cookie存储路径增加账号标识，如 zhihu-cookies-{account_id}.enc；
      (2) 增加 `--account` CLI参数，支持多账号Cookie分别管理；
      (3) SKILL.md用户使用路径中考虑账号上下文。

  - dimension: 数据闭环缺失
    severity: medium
    title: 只能"发"不能"追踪" — 缺少内容发布后效果数据
    detail: >-
      方案有数据提取功能，但只提取别人的数据（热榜/搜索/用户/问题），
      没有自己发布内容的阅读量、互动量、涨粉量等效果指标。
      内容创作者的核心需求是"发了之后效果如何"——但目前方案没有
      任何发布后分析。这导致AI是"蒙着眼发文章"——不知道什么内容
      有效、什么时间好、什么风格受欢迎。
    recommendation: >-
      (1) 增加发布后效果追踪模块，自动抓取自己内容的阅读数、点赞数、
      评论数、关注数变化；(2) 增加简单的发布日志（含时间、内容、链接、
      初始效果）；(3) 考虑长期积累可用于AI策略优化的数据。

  - dimension: 安全与合规
    severity: medium
    title: 没有多设备Cookie同步机制和环境安全隔离
    detail: >-
      Cookie是当前唯一认证方式，有效期约30天。但方案没有考虑：
      (1) Cookie泄露后没有一键失效机制（需要去知乎改密码）；
      (2) 没有多设备Cookie同步方案（用户换了电脑需要重新导出）；
      (3) ZHIHU_COOKIE_KEY 存在环境变量中，在多用户系统中不安全；
      (4) CAPTCHA_API_KEY 也在环境变量中，属于敏感凭据但无额外保护。
      此外，方案测试只在macOS上，但实际Playwright在Linux headless模式
      下行为不同（无沙箱、无显卡加速、Draft.js渲染差异）。
    recommendation: >-
      (1) 增加"清除Cookie"CLI命令，提供远程失效能力；
      (2) 设计Cookie导入导出（加密传输）机制；
      (3) 考虑将敏感凭据放入系统密钥链（macOS Keychain）；
      (4) 增加Linux headless兼容性测试。
